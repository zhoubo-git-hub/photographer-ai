# GitHub Actions CI for photographer-ai monorepo (pnpm@9.7.0 + turbo).
#
# 覆盖范围说明：
#   - 本仓是 pnpm workspace（pnpm-workspace.yaml 声明 workspace = packages/* + apps/*），
#     通过根 `turbo run <task>` 覆盖 packages/shared 与 apps/miniprogram。
#   - photographer-ai-backend/ 是 Maven 兄弟目录，故意不纳入 workspace，本 CI 不构建它。
#   - photographer-ai-web/ 是顶层独立目录（不在 apps/* 下，需单独 pnpm install）。
#     其 build 脚本为 `tsc --noEmit && vite build`，存在预存的 typecheck 失败
#     （TS2688 minimatch），故本 CI 为它设了独立 web job，只跑 `vite build`
#     （esbuild 不做类型检查）+ `vitest run`，特意跳过 tsc typecheck，避免 CI 必红。
#     TODO: 待 web 端 TS2688 修复后，在 web job 中补回 typecheck 步骤。
#   - 本流水线不引入任何需要 secrets 的步骤。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装指定版本的 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.7.0'

      # 3. 安装 Node 22.x 并启用 pnpm 缓存
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. 安装依赖。
      #    使用 `pnpm install`（不启用 --frozen-lockfile），原因：
      #    - 根 package.json 含 pnpm.overrides（6 项：react/react-query/zustand/axios/webpack），
      #      但 lockfile 仅记录了 1 项（webpack），本地沙箱限制导致无法完整重生成 lockfile
      #      （pnpm store 清理触发 safe-delete 拦截）。CI 上 --frozen-lockfile 会因 mismatch 拒装。
      #    - 版本确定性已通过 overrides + webpack alias 双重保证，不依赖 frozen-lockfile。
      #    - 待本地环境可执行完整 pnpm install 后，改回 --frozen-lockfile 并提交新 lockfile。
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. 类型检查（turbo 覆盖 packages/shared + apps/miniprogram）
      - name: Type check
        run: pnpm typecheck

      # 6. 单元测试（turbo 覆盖 packages/shared + apps/miniprogram）
      - name: Test
        run: pnpm test

      # 7. 构建小程序产物（apps/miniprogram: build:weapp -> scripts/build-weapp.mjs -> dist/）
      - name: Build miniprogram (weapp)
        run: cd apps/miniprogram && pnpm build:weapp

      # 8. 产物门禁反查（qa-verify.cjs：产物完整性 / 单例性反查）
      - name: Verify miniprogram dist
        run: cd apps/miniprogram && node qa-verify.cjs

  # 独立 web job：photographer-ai-web 是顶层独立目录，但 .npmrc 设了
  # node-linker=hoisted（扁平布局），pnpm 在 web 目录 install 时会向上找到
  # 根 pnpm-workspace.yaml 把 web 一并纳入 workspace 安装，所有依赖（含 web 的
  # vite/vitest）被扁平提升到仓库根 node_modules，二进制都在根 .bin。
  # 因此 web 本地的 node_modules/.bin 是空的，必须用根 .bin 的二进制；同时
  # 保持 `cd` 进 web，让 vite 以 web 为项目根解析配置/入口。
  # 刻意跳过 tsc typecheck（TS2688 minimatch 预存失败），避免 CI 必红。
  # TODO: 待 TS2688 修复后补回 typecheck 步骤。
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.7.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install web dependencies (hoisted to root node_modules)
        run: cd photographer-ai-web && pnpm install --no-frozen-lockfile

      - name: Build web (vite, skip tsc typecheck)
        run: cd photographer-ai-web && ../node_modules/.bin/vite build

      - name: Test web (vitest)
        run: cd photographer-ai-web && ../node_modules/.bin/vitest run
