# GitHub Actions CI for photographer-ai monorepo (pnpm@9.7.0 + turbo).
#
# 覆盖范围说明：
#   - 本仓是 pnpm workspace（pnpm-workspace.yaml 声明 workspace =
#     packages/* + apps/* + photographer-ai-web）。
#   - 通过根 `turbo run <task>` 覆盖 packages/shared 与 apps/miniprogram。
#   - photographer-ai-backend/ 是 Maven 兄弟目录，不在 pnpm workspace 内，
#     但由独立的 `backend` job 用 setup-java@v7(JDK17) + Maven 覆盖编译与单测；
#     单测含 @DataJpaTest（需真连 PG），故该 job 用 services 起 postgres:16 容器。
#   - photographer-ai-web/ 是顶层目录，现已正式纳入 workspace（见 pnpm-workspace.yaml），
#     由独立的 web job 用 `pnpm --filter photographer-ai-web exec vite build` 构建。
#     其 build 脚本为 `tsc --noEmit && vite build`，CI 的 web job 现已完整跑
#     `tsc --noEmit`（typecheck）+ `vite build` + `vitest run`。
#     TS2688（@types/minimatch 空 stub 被 tsc 默认自动纳入）已在 web 的
#     tsconfig.json 加 `"types": []` 修复，故 web 的 typecheck 已纳入 CI 卡点。
#     为保持 job 职责清晰、web 独立并行，build job 的 typecheck/test 仍用
#     `--filter='!photographer-ai-web'` 仅覆盖 packages/shared + apps/miniprogram。
#   - 本流水线不引入任何需要 secrets 的步骤。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v7

      # 2. 安装指定版本的 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9.7.0'

      # 3. 安装 Node 22.x 并启用 pnpm 缓存
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. 安装依赖。
      #    使用 `pnpm install`（不启用 --frozen-lockfile），原因：
      #    - 根 package.json 含 pnpm.overrides（6 项：react/react-query/zustand/axios/webpack），
      #      但 lockfile 仅记录了 1 项（webpack），本地沙箱限制导致无法完整重生成 lockfile
      #      （pnpm store 清理触发 safe-delete 拦截）。CI 上 --frozen-lockfile 会因 mismatch 拒装。
      #    - 版本确定性已通过 overrides + webpack alias 双重保证，不依赖 frozen-lockfile。
      #    - 待本地环境可执行完整 pnpm install 后，改回 --frozen-lockfile 并提交新 lockfile。
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. 类型检查（turbo 覆盖 packages/shared + apps/miniprogram；
      #    用 --filter 排除 web，避免 web 的预存 TS2688 误伤主构建）
      - name: Type check
        run: pnpm exec turbo run typecheck --filter='!photographer-ai-web'

      # 6. 单元测试（同上，排除 web）
      - name: Test
        run: pnpm exec turbo run test --filter='!photographer-ai-web'

      # 7. 构建小程序产物（apps/miniprogram: build:weapp -> scripts/build-weapp.mjs -> dist/）
      - name: Build miniprogram (weapp)
        run: cd apps/miniprogram && pnpm build:weapp

      # 8. 产物门禁反查（qa-verify.cjs：产物完整性 / 单例性反查）
      - name: Verify miniprogram dist
        run: cd apps/miniprogram && node qa-verify.cjs

  # 独立 web job：photographer-ai-web 现已是正式 workspace 成员（见 pnpm-workspace.yaml），
  # 故在根目录 pnpm install 即可把它的依赖（含 vite/vitest/tsc）随整仓一起装好，
  # 再用 pnpm 标准的 `--filter` 方式在 web 包上下文里执行二进制，解析最可靠。
  # TS2688 已通过 web tsconfig 的 `"types": []` 修复，故此处完整卡
  # tsc --noEmit（typecheck）+ vite build + vitest run。
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9.7.0'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (root, installs all workspace members incl. web)
        run: pnpm install --no-frozen-lockfile

      - name: Type check web (tsc --noEmit)
        run: pnpm --filter photographer-ai-web exec tsc --noEmit

      - name: Build web (vite)
        run: pnpm --filter photographer-ai-web exec vite build

      - name: Test web (vitest)
        run: pnpm --filter photographer-ai-web exec vitest run

  # 独立 backend job：Maven 兄弟目录 photographer-ai-backend（不在 pnpm workspace）。
  # actions/setup-java@v5 提供 JDK17（版本线独立，最新仅 v5，与 pom 一致；
  # 本地 Windows 的 JDK8 系统变量不影响 CI）。mvn test 现已挂 JaCoCo（见 pom.xml），
  # 自动产出 target/site/jacoco 覆盖率报告并作为产物上传。
  # 单测含 @DataJpaTest（如 ScheduleConflictServiceTest）需真连 PostgreSQL，
  # 故用 GitHub Actions services 起 postgres:16 容器，库名/账密对齐 application.yml
  # （jdbc:postgresql://localhost:5432/photogai，user/pass=postgres/postgres，flyway 自动建表）。
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: photogai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and test (Maven)
        working-directory: photographer-ai-backend
        run: mvn -B test

      # JaCoCo 覆盖率报告（HTML/CSV/XML）由 mvn test 的 jacoco report 阶段产出。
      # 上传为构件，便于在 CI 页面直接下载查看；不设置阈值卡点（当前基线约 14% 指令覆盖，
      # 后续补 controller/集成测试提升，避免因阈值失败阻断流水线）。
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: photographer-ai-backend/target/site/jacoco
          if-no-files-found: ignore
