# 集成测试 profile（@ActiveProfiles("test")）
# 本地默认连隔离库 photogai_it（不污染用户联调用的 photogai）；
# CI 通过 backend job 的 DB_URL 环境变量指向 postgres service 的 photogai。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/photogai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  # 仅测试用的固定密钥（>=32 字节），不接生产
  secret: ${JWT_SECRET:test-secret-test-secret-test-secret-test-secret-1234567890}
  expiration-ms: 86400000

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

app:
  payment:
    mock: true

logging:
  level:
    com.photogai: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.web.client: WARN
