server:
  port: 8080

spring:
  application:
    name: photographer-ai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/photogai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-bytes-long!!}
  expiration-ms: 86400000

# LLM 配置：DeepSeek（OpenAI 兼容协议）。密钥仅走环境变量，不入库。
deepseek:
  # 客户端会在 base-url 后追加 /v1/chat/completions，故此处不要带 /v1 后缀
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

# 阶段2 应用配置
app:
  # 复购引擎扫描 cron（每日 02:30），可由环境变量 APP_REPURCHASE_CRON 覆盖
  repurchase:
    cron: ${APP_REPURCHASE_CRON:0 30 2 * * ?}

  # 阶段3 支付配置
  payment:
    # 默认开启 mock 闭环（沙箱可直接跑通，无需外部商户号）；生产置 false 并配置微信参数
    mock: ${APP_PAYMENT_MOCK:true}
    # 真实支付通道：WECHAT | ALIPAY（mock=true 时不生效）
    channel: ${APP_PAYMENT_CHANNEL:WECHAT}
    wechat:
      mchid: ${APP_WECHAT_MCHID:}
      appid: ${APP_WECHAT_APPID:}
      # APIv3 密钥（仅后端使用，走环境变量，不入库）
      key: ${APP_WECHAT_KEY:}
    # 套餐定价（元/月）
    price:
      pro: 39
      team: 99
  # 订阅到期扫描 cron（每日 04:00），可由环境变量 APP_SUBSCRIPTION_CRON 覆盖
  subscription:
    expire-cron: ${APP_SUBSCRIPTION_CRON:0 0 4 * * ?}

logging:
  level:
    com.photogai: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web.client: WARN
